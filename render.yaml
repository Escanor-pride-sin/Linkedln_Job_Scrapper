services:
  # Backend API
  - type: web
    name: linkedin-scraper-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PUPPETEER_HEADLESS
        value: true
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /

  # Frontend (Optional - or use Vercel/Netlify)
  - type: web
    name: linkedin-scraper-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s build -l 3000
    envVars:
      - key: REACT_APP_API_URL
        sync: false
